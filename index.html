<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Spy with an AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>I Spy with an AI</h1>
        
        <div id="scoreboard">
            <p>Scores</p>
            <span>You: <span id="player-score">0</span></span>
            <span>AI: <span id="ai-score">0</span></span>
        </div>

        <div id="image-display-area">
            <img id="game-image" src="" alt="Game scene will be displayed here" style="display:none;">
            <video id="camera-stream" autoplay playsinline style="display: none;"></video>
            <div id="image-placeholder">
                <p>Use your camera to start the game.</p>
                <button id="start-camera-btn" class="button">Use Camera</button>
            </div>
            <button id="take-picture-btn" class="button" style="display: none;">Take Picture</button>
        </div>

        <div id="message-area">
            <p id="game-message">Welcome! It's the AI's turn first. Use your camera to show me the room.</p>
        </div>

        <div id="controls-area">
            <div id="player-hint-controls" class="control-group" style="display:none;">
                <input type="text" id="player-hint-input" placeholder="Type your hint (e.g., a color)...">
                <button id="submit-hint-btn" class="button">Give Hint</button>
            </div>
            <div id="player-guessing-controls" class="control-group" style="display:none;">
                <input type="text" id="player-guess-input" placeholder="Type your guess...">
                <button id="submit-guess-btn" class="button">Guess</button>
                <button id="mic-btn" class="button icon-button">
                    <img src="microphone.png" alt="Use Microphone">
                </button>
            </div>
            <div id="ai-guessing-controls" class="control-group" style="display:none;">
                <p>Is the AI's guess correct?</p>
                <button id="ai-guess-correct-btn" class="button">Yes, Correct!</button>
                <button id="ai-guess-wrong-btn" class="button">No, Wrong.</button>
            </div>
             <div id="new-round-controls" class="control-group" style="display:none;">
                <button id="new-round-btn" class="button">Start Next Round</button>
            </div>
        </div>
        
        <div id="loading-spinner" style="display:none;"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
